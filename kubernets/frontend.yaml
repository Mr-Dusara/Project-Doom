apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: qa-namespace
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontnd-container
        image: dooms002/frontend:qa
        ports:
        - containerPort: 80
        env:
        - name: API_IP
          value: "54.166.175.109"

---
apiVersion: v1
kind: Service
metadata:
  name: frontnd-srv
  namespace: qa-namespace
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30008