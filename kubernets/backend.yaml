apiVersion: v1
kind: Namespace
metadata:
  name: qa-namespace 

--- 

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: qa-namespace
  labels:
    app: backend
spec:
  replicas: 
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backnd-container
        image: dooms002/backend:qa
        ports:
        - containerPort: 8080
        env:
        - name: MONGO_URL
          value: "mongodb://mongodb/dd_db"
      - name: mongo-container
        image: mongo:6
        ports:
        - containerPort: 27017
        volumeMounts:
        - mountPath: /data/db
          name: db-data
      volumes:
      - name: db-data
        hostPath:
         path: /data/db

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: qa-namespace
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

---
apiVersion: v1
kind: Service
metadata:
  name: backnd-srv
  namespace: qa-namespace
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30009